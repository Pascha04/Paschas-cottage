# Zoek 50 afbeeldingen

In deze verzameling laat ik de volgende onderdelen zien:
- Vertaling film aesthetic naar pagina -> Als je een film hebt gekozen op de homepagina, wordt de hele pagina omgezet naar
de sfeer van die film/serie door middel van kleur, fonts, afbeeldingen en overige grafische elementen.
- Inspirerende quotes van acteurs/personages -> lessen van acteurs/personages en waarom de film industry zo belangrijk is.
- Mijn reviews -> Wat vind ik van deze films/series en welke lessen heb ik eruit gehaald? Wat zijn de favorieten?
- Website elementen -> Welke onderdelen die met film te maken hebben kunnen er op de (home)pagina, zoals 
film bibliotheek en muziek.

<img src="imagess/collage-van-afbeeldingen-film-idee-website.jpg" width="350px">
